<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cheeky Rip // TDAH SoundLab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Cheeky Rip ⚡</h1>
        <p>Rescue your audio files and feed the TDAH SoundLab 8D spatial matrix.</p>
        <div class="card">
            <input type="text" id="urlInput" placeholder="Paste SoundCloud or public audio link...">
            <button id="ripBtn">Rip & Load Stream</button>
        </div>
        <div class="dropzone" id="dropZone">
            <p>Or drop local MP3/WAV files here (iTunes Rescue)</p>
            <input type="file" id="fileInput" accept="audio/*" hidden>
        </div>
        <div id="statusLog" class="status">Status: Idle</div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
